<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="stylesheet" href="/src/style/main.css" />
        <link rel="stylesheet" href="/src/style/intro.css" />
        <link rel="stylesheet" href="/src/style/main-menu.css" />
        <link rel="stylesheet" href="/src/style/waiting.css" />
        <link rel="stylesheet" href="/src/style/gameplay.css" />
        <link rel="stylesheet" href="/src/style/stage.css" />
        <link rel="stylesheet" href="/src/style/text.css" />
        <link rel="stylesheet" href="/src/style/tokens.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TCG Master</title>
    </head>
    <body>
        <div id="app">
            <div id="intro" class="app">
                <div>
                    <h1><span id="hi">Hi.</span> <span id="thanks">Thanks.</span></h1>
                    <div id="name-dialog">
                        What's your name?<br />
                        <form onsubmit="submitName(event)">
                            <input id="name-input" type="text" />
                            <input type="submit" value="Submit" />
                        </form>
                    </div>
                </div>
            </div>
            <div id="main-menu" class="app">
                <div class="subsection">
                    <h1>New game</h1>
                    <div class="flex-row">
                        <button onclick="newGameCom()">vs COM</button>
                        <button onclick="newGameHuman()">vs Human</button>
                    </div>
                </div>
            </div>
            <div id="waiting" class="app">
                <h1>Hold your Horseas.</h1>
                <marquee id="wait-message"></marquee>
            </div>
            <div id="gameplay" class="app">
                <div class="flex-col">
                    <div id="stage"></div>
                    <div id="hand"></div>
                    <div id="commands">
                        <div id="commands-you" class="commands-panel">You<div></div></div>
                        <div id="commands-opponent" class="commands-panel">Opponent<div></div></div>
                        <div id="commands-debug" class="commands-panel">Debug<div></div></div>
                    </div>
                </div>
                <div class="flex-col">
                    <div id="showcase"></div>
                    <div id="console"></div>
                    <div id="controls">
                        <div id="prompt"></div>
                        <div id="choices"></div>
                        <form id="input-form" onsubmit="formSubmit(event)">
                            <input id="input" type="text" autocomplete="off" />
                            <input type="submit" value="Submit" />
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
